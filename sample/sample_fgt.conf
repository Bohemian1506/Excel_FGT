#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=0000000000000000
#buildno=1639
#global_vdom=1
config system global
    set alias "FGT-DUMMY"
    set hostname "FGT-DUMMY-01"
    set timezone 80
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set description "社内LAN"
        config ipv6
            set ip6-address 2001:db8::1/64
        end
    next
end
config firewall address
    edit "none"
        set uuid 11111111-1111-1111-1111-111111111111
        set subnet 0.0.0.0 255.255.255.255
    next
    edit "SV_File01"
        set uuid 22222222-2222-2222-2222-222222222222
        set comment "ファイルサーバ \"本番\""
        set subnet 192.168.1.10 255.255.255.255
    next
    edit "FQDN_Example"
        set uuid 33333333-3333-3333-3333-333333333333
        set type fqdn
        set fqdn "www.example.com"
    next
end
config firewall addrgrp
    edit "GRP_Servers"
        set uuid 44444444-4444-4444-4444-444444444444
        set member "SV_File01" "FQDN_Example"
    next
end
config firewall policy
    edit 1
        set name "LAN_to_WAN"
        set uuid 55555555-5555-5555-5555-555555555555
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set nat enable
        set comments "1行目
2行目"
    next
    edit 2
        set name "Deny_Servers"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "GRP_Servers"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
end
config router bgp
    set as 65001
    set router-id 192.168.1.99
    config neighbor
        edit "203.0.113.1"
            set remote-as 65000
        next
    end
end
